[versions]
# Versions mirror the shop's other Compose apps, so this builds against the same
# Compose/MMD combination that is known to work on the Kompakt.
agp = "8.13.1"
kotlin = "2.2.21"
mmd = "1.0.2"

androidx-activity = "1.12.0"
androidx-core = "1.17.0"
androidx-lifecycle = "2.10.0"
androidx-compose = "1.9.5"
androidx-material3 = "1.4.0"

# KeePass (KDBX) reading and writing.
kotpass = "0.13.0"
# kotpass uses okio internally and hands its ByteStrings out in the header parameters.
okio = "3.15.0"
# The reference Argon2 in C, for opening a vault in seconds rather than tens of them.
argon2kt = "1.6.0"
# Reading QR codes out of pictures.
zxing = "3.5.3"

junit5 = "5.11.4"
bouncycastle = "1.78.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }

compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-material3" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose" }

mmd = { module = "com.mudita:MMD", version.ref = "mmd" }

kotpass = { module = "app.keemobile:kotpass", version.ref = "kotpass" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2kt" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
